[project]
name = "snowpark-rs-session"
version = "0.1.0"
description = "Native Snowflake session backend for snowpark-rs"
requires-python = ">=3.13"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "_snowpark_rs_session"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../src/**/*.rs" },
    { file = "../snowflake-ast/src/**/*.rs" },
]
