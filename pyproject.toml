[project]
name = "snowpark-rs"
version = "0.1.0"
description = "Build parameterized Snowflake DataFrame queries from Python"
readme = "README.md"
authors = [
    { name = "Tijoxa", email = "92037181+Tijoxa@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
session = ["pyarrow", "snowpark-rs-session==0.1.0", "tzdata"]
polars = ["polars>=1"]

[dependency-groups]
dev = ["pytest", "snowflake-snowpark-python>=1.57.0"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "snowpark_rs._core"
python-packages = ["snowpark_rs"]
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "src/snowpark_rs/*.py" },
    { file = "src/snowpark_rs/*.pyi" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/snowflake-ast/Cargo.toml" },
    { file = "crates/snowflake-ast/src/**/*.rs" },
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.13,<3.15" }

[tool.uv.sources]
snowpark-rs-session = { workspace = true }

[tool.uv.workspace]
members = ["crates/snowpark-rs-session"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
